# pnpm settings home (pnpm 11+). See https://pnpm.io/settings
# esbuild needs its postinstall build script.
allowBuilds:
  esbuild: true

# Opt out of the default 1-day release cooldown (pnpm 11+ default: 1440).
minimumReleaseAge: 0

overrides:
  postcss-selector-parser@<7.1.6: ^7.1.6

# Accepted dependency advisories — see docs/security/known-advisories.md.
# Each entry must have a documented rationale and a review trigger; anything
# not listed here still fails `pnpm audit`.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
